# Produce los cuatro instaladores de Reverón: .dmg (arm64 + x64), .msi, .AppImage.
#
# Distribución de Linux de referencia para v1: Ubuntu 24.04 LTS (webkit2gtk-4.1).
# Otras distribuciones pueden requerir paquetes de WebKitGTK distintos.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            ext: dmg
            platform: darwin-aarch64
            updaterDir: macos
            updaterExt: app.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            bundle: dmg
            ext: dmg
            platform: darwin-x86_64
            updaterDir: macos
            updaterExt: app.tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundle: msi
            ext: msi
            platform: windows-x86_64
            updaterDir: msi
            updaterExt: msi.zip
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: appimage
            ext: AppImage
            platform: linux-x86_64
            updaterDir: appimage
            updaterExt: AppImage.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm install

      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Fetch Node sidecar binary
        run: node scripts/fetch-node.mjs --target ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri system deps (Linux — Ubuntu 24.04 reference)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      - name: Build installer
        env:
          # D7: clave privada del actualizador — secreto de CI, nunca en el repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run app:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Verify installer size (NFR-12 — falla si supera 150 MB)
        shell: bash
        env:
          INSTALLER_DIR: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}
          INSTALLER_EXT: ${{ matrix.ext }}
        run: |
          node --input-type=module -e '
          import { readdirSync, statSync } from "node:fs";
          import { join } from "node:path";

          const LIMIT = 150 * 1024 * 1024;
          const dir = process.env.INSTALLER_DIR;
          const ext = "." + process.env.INSTALLER_EXT;
          const files = readdirSync(dir).filter((f) => f.endsWith(ext));

          if (files.length === 0) throw new Error(`No se encontró ningún ${ext} en ${dir}`);

          for (const file of files) {
            const size = statSync(join(dir, file)).size;
            const mb = (size / 1024 / 1024).toFixed(1);
            console.log(`${file}: ${mb} MB`);
            if (size > LIMIT) {
              throw new Error(`${file} pesa ${mb} MB, supera el límite de 150 MB del NFR-12`);
            }
          }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: reveron-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*.${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload updater artifact + firma (D7)
        uses: actions/upload-artifact@v4
        with:
          name: reveron-updater-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.updaterDir }}/*.${{ matrix.updaterExt }}
            src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.updaterDir }}/*.${{ matrix.updaterExt }}.sig
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: reveron-*
          path: artifacts

      - name: Build latest.json (manifiesto del actualizador)
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module -e '
          import { readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const tag = process.env.TAG;
          const repo = process.env.REPO;

          // target -> clave de plataforma que espera tauri-plugin-updater (OS-ARCH).
          const targets = {
            "aarch64-apple-darwin": "darwin-aarch64",
            "x86_64-apple-darwin": "darwin-x86_64",
            "x86_64-pc-windows-msvc": "windows-x86_64",
            "x86_64-unknown-linux-gnu": "linux-x86_64",
          };

          const platforms = {};
          for (const [target, platform] of Object.entries(targets)) {
            const dir = join("artifacts", `reveron-updater-${target}`);
            const files = readdirSync(dir);
            const sigName = files.find((f) => f.endsWith(".sig"));
            const bundleName = files.find((f) => !f.endsWith(".sig"));
            if (!sigName || !bundleName) {
              throw new Error(`Faltan artefactos de actualización en ${dir}`);
            }
            platforms[platform] = {
              signature: readFileSync(join(dir, sigName), "utf8").trim(),
              url: `https://github.com/${repo}/releases/download/${tag}/${bundleName}`,
            };
          }

          writeFileSync(
            "latest.json",
            JSON.stringify(
              { version: tag, pub_date: new Date().toISOString(), platforms },
              null,
              2,
            ),
          );
          '

      - name: Publicar release con instaladores, artefactos firmados y manifiesto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/reveron-*/* \
            latest.json \
            --title "Reverón ${{ github.ref_name }}" \
            --generate-notes
