# Generated by `orch ci setup` from this repository's files. Safe to edit:
# orch never overwrites it unless asked to (--force).
#
# Runs on every pull request, which is what orch's auto-PR loop waits on
# (config.yaml `vcs:`), and on pushes to the base branch.
name: orch-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: node (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  rust:
    name: rust (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri::generate_context! lee tauri.conf.json y exige que frontendDist
      # exista, así que la interfaz se construye antes de tocar cargo.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
      - name: Build UI
        run: npm run build:ui

      # `binaries/` esta en .gitignore: el binario de Node se baja, no se
      # versiona. Sin el, el build script de tauri aborta con
      # "resource path binaries/node-<triple> doesn't exist".
      - name: Cache Node sidecar binary
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: node-sidecar-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/fetch-node.mjs') }}
      - name: Fetch Node sidecar binary
        run: node scripts/fetch-node.mjs --target x86_64-unknown-linux-gnu

      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test
