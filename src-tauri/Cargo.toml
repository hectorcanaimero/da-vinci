[package]
name = "reveron"
version = "0.1.0"
description = "Reverón — cáscara de escritorio Tauri"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# D7: actualizador firmado con clave propia (cargo tauri signer generate),
# no tiene nada que ver con el notarizado de Apple ni el certificado de Windows.
tauri-plugin-updater = "2"
# F3.3.T1: diálogo nativo de archivos para adjuntar referencias (FR-19).
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# keyring 3, no 4: la 4.x se reescribió sobre keyring-core y cambió el modelo de
# stores. Sin features no se compila ningún backend, van los tres a mano.
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
# Ya resuelta en el árbol de tauri (reqwest 0.13.5, ver Cargo.lock); acá sólo
# se declara para usarla directo en la rotación en caliente de F2.1.T2.
reqwest = { version = "0.13", features = ["json"] }
