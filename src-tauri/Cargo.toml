[package]
name = "reveron"
version = "0.1.0"
description = "Reverón — cáscara de escritorio Tauri"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# D3: llavero nativo por plataforma. `sync-secret-service` evita arrastrar un
# runtime async sólo para Linux, y `crypto-rust` evita depender de OpenSSL.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
